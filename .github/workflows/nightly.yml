name: nightly-update-and-deploy

# Runs the StackMatrix autopilot: refresh pricing data, draft 5 new
# integration pairs, rebuild the static site, deploy to GitHub Pages.
# No secrets needed - uses the built-in GITHUB_TOKEN.
on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:      # manual "Run workflow" button
  push:
    branches: [main]      # deploys immediately on every push

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3
         

      - name: Nightly data update
        run: |
          sqlite3 database/stack_data.db < database/seed.sql
          python3 agent_scripts/nightly_update.py
          sqlite3 database/stack_data.db .dump > database/seed.sql

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build site
        run: |
          cd site
          npm install
          python3 ../agent_scripts/gen_redirect_pages.py
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - uses: actions/deploy-pages@v4

      - name: Commit updated data
        run: |
          git config user.name "stackmatrix-bot"
          git config user.email "stackmatrix-bot@users.noreply.github.com"
          git add database/seed.sql site/src/data/
          git diff --cached --quiet || (git commit -m "nightly data update $(date -u +%F)" && git push)
